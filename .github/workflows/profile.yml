name: Generate profile stats

# Generates the SVG assets used by the profile README (banner, tagline,
# stats dashboard) and commits them to the repository.
# Everything runs here, on GitHub: no external widget servers involved.

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 3 * * *" # every day at 03:17 UTC (04:17 Italian time)
  workflow_dispatch: # allows manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SVG assets
        run: python3 .github/scripts/generate_assets.py --out assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push (only if something changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(profile): refresh stats assets"
            git push
          fi
